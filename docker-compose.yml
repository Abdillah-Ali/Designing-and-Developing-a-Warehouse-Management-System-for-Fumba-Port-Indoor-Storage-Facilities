services:

  postgres:
    image: postgres:17
    container_name: fumba-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: fumba-backend

    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run init-db && npm run migrate && npm run dev"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CARGO_DOCUMENT_UPLOAD_ROOT: ${CARGO_DOCUMENT_UPLOAD_ROOT:-/app/uploads/cargo-documents}
      CARGO_DOCUMENT_MAX_BYTES: ${CARGO_DOCUMENT_MAX_BYTES:-10485760}
      CARGO_DOCUMENT_TYPES_JSON: ${CARGO_DOCUMENT_TYPES_JSON:-}
      SYSTEM_ADMIN_ROLE_NAME: ${SYSTEM_ADMIN_ROLE_NAME:-System Admin}
      WAREHOUSE_STAFF_ROLE_NAME: ${WAREHOUSE_STAFF_ROLE_NAME:-Warehouse Staff}
      WAREHOUSE_SUPERVISOR_ROLE_NAME: ${WAREHOUSE_SUPERVISOR_ROLE_NAME:-Supervisor}
      FINANCE_OFFICER_ROLE_NAME: ${FINANCE_OFFICER_ROLE_NAME:-Finance Officer}
      CUSTOMS_OFFICER_ROLE_NAME: ${CUSTOMS_OFFICER_ROLE_NAME:-Customs Officer}
      GATE_OFFICER_ROLE_NAME: ${GATE_OFFICER_ROLE_NAME:-Gate Officer}
      MANAGEMENT_ROLE_NAME: ${MANAGEMENT_ROLE_NAME:-Management}
      SCANNER_ROLE_NAME: ${SCANNER_ROLE_NAME:-Scanner}
      WMS_ROLE_DEFINITIONS_JSON: ${WMS_ROLE_DEFINITIONS_JSON:-}
      WMS_DEFAULT_SHIFTS_JSON: ${WMS_DEFAULT_SHIFTS_JSON:-}
      WMS_REJECTION_CONDITIONS_JSON: ${WMS_REJECTION_CONDITIONS_JSON:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-flutterwave}
      PAYMENT_ENVIRONMENT: ${PAYMENT_ENVIRONMENT:-sandbox}
      FLUTTERWAVE_API_BASE_URL: ${FLUTTERWAVE_API_BASE_URL:-https://developersandbox-api.flutterwave.com}
      FLUTTERWAVE_OAUTH_TOKEN_URL: ${FLUTTERWAVE_OAUTH_TOKEN_URL:-https://idp.flutterwave.com/realms/flutterwave/protocol/openid-connect/token}
      FLUTTERWAVE_CLIENT_ID: ${FLUTTERWAVE_CLIENT_ID:-}
      FLUTTERWAVE_CLIENT_SECRET: ${FLUTTERWAVE_CLIENT_SECRET:-}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:-}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:3000/finance/payments/return}
      PAYMENT_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-}

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend

    container_name: fumba-frontend

    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host"

    depends_on:
      - backend

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
