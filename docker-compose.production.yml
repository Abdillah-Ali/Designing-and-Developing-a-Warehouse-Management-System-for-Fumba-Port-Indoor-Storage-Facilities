services:
  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${POSTGRES_OWNER_USER:?POSTGRES_OWNER_USER is required}
      DB_PASSWORD_FILE: /run/secrets/postgres_owner_password
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets: [postgres_owner_password, app_db_password, jwt_secret]
    command: ["sh", "-c", "npm run init-db && npm run migrate && node database/applyRuntimeGrants.js"]
    networks: [database]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      DB_PASSWORD_FILE: /run/secrets/app_db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CORS_ORIGIN: ${WMS_PUBLIC_ORIGIN:?WMS_PUBLIC_ORIGIN is required}
      CARGO_DOCUMENT_UPLOAD_ROOT: /app/uploads/cargo-documents
      PAYMENT_PROVIDER: flutterwave
      PAYMENT_ENVIRONMENT: ${PAYMENT_ENVIRONMENT:-sandbox}
      FLUTTERWAVE_API_BASE_URL: ${FLUTTERWAVE_API_BASE_URL:-https://developersandbox-api.flutterwave.com}
      FLUTTERWAVE_OAUTH_TOKEN_URL: ${FLUTTERWAVE_OAUTH_TOKEN_URL:-https://idp.flutterwave.com/realms/flutterwave/protocol/openid-connect/token}
      FLUTTERWAVE_CLIENT_ID: ${FLUTTERWAVE_CLIENT_ID:?FLUTTERWAVE_CLIENT_ID is required}
      FLUTTERWAVE_CLIENT_SECRET: ${FLUTTERWAVE_CLIENT_SECRET:?FLUTTERWAVE_CLIENT_SECRET is required}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET:?FLUTTERWAVE_WEBHOOK_SECRET is required}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:?PAYMENT_CALLBACK_URL is required}
      PAYMENT_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:?PAYMENT_WEBHOOK_URL is required}
    secrets: [app_db_password, jwt_secret]
    volumes:
      - cargo_documents:/app/uploads
    networks: [application, database]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_URL: ""
    restart: unless-stopped
    networks: [application]

  edge:
    image: nginx:1.27.4-alpine3.21
    restart: unless-stopped
    depends_on: [backend, frontend]
    environment:
      WMS_SERVER_NAME: ${WMS_SERVER_NAME:?WMS_SERVER_NAME is required}
    command: ["/bin/sh", "-c", "envsubst '$$WMS_SERVER_NAME' < /etc/nginx/templates/wms.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/wms-production.conf:/etc/nginx/templates/wms.conf.template:ro
    secrets: [tls_certificate, tls_private_key]
    networks: [application]

secrets:
  postgres_owner_password:
    file: ${POSTGRES_OWNER_PASSWORD_FILE:?POSTGRES_OWNER_PASSWORD_FILE is required}
  app_db_password:
    file: ${APP_DB_PASSWORD_FILE:?APP_DB_PASSWORD_FILE is required}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?TLS_CERTIFICATE_FILE is required}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?TLS_PRIVATE_KEY_FILE is required}

volumes:
  postgres_data:
  cargo_documents:

networks:
  application:
  database:
    internal: true
